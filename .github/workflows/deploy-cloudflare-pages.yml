name: Publish Docs production

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-production
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm run build

      - name: Stamp deployment identity
        run: |
          node <<'NODE'
          const fs = require('fs');

          fs.writeFileSync(
            'dist/mira-deployment.json',
            `${JSON.stringify({
              repository: process.env.GITHUB_REPOSITORY,
              commit: process.env.GITHUB_SHA,
              workflowRunId: process.env.GITHUB_RUN_ID,
            })}\n`,
          );
          NODE

      - name: Build changed URL list
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$BEFORE_SHA"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi

          if [ -n "$BASE_SHA" ]; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > /tmp/changed-files.txt
          else
            git show --pretty='' --name-only "$GITHUB_SHA" > /tmp/changed-files.txt
          fi

          node <<'NODE'
          const fs = require('fs');

          const changed = fs.readFileSync('/tmp/changed-files.txt', 'utf8')
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean);
          const sitemap = fs.readFileSync('dist/sitemap.xml', 'utf8');
          const sitemapUrls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1]);

          const normalizePath = (value) => {
            try {
              return decodeURI(value).replace(/\/$/, '') || '/';
            } catch {
              return value.replace(/\/$/, '') || '/';
            }
          };

          const urlsByPath = new Map(
            sitemapUrls.map((url) => {
              const parsed = new URL(url);
              return [normalizePath(parsed.pathname), url];
            }),
          );

          const candidates = new Set();
          let hasSiteWideChange = false;

          for (const file of changed) {
            if (/^src\/pages\/.+\.md$/i.test(file) && !/(^|\/)README\.md$/i.test(file)) {
              let route = file
                .replace(/^src\/pages/, '')
                .replace(/^\/docs/, '')
                .replace(/\.md$/i, '');
              if (!route) route = '/';
              candidates.add(normalizePath(route));
              continue;
            }

            if (
              file === 'index.html' ||
              file === 'src/site.config.ts' ||
              /^src\/(components\/|.*\.(tsx?|css)$)/.test(file)
            ) {
              hasSiteWideChange = true;
            }
          }

          if (hasSiteWideChange) candidates.add('/');

          const urls = [...new Set(
            [...candidates]
              .map((path) => urlsByPath.get(path))
              .filter(Boolean),
          )];

          fs.writeFileSync('urls.txt', urls.length ? `${urls.join('\n')}\n` : '');

          console.log(`Changed files: ${changed.length}`);
          console.log(`URLs selected for Baidu: ${urls.length}`);
          if (urls.length) console.log(urls.join('\n'));
          NODE

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: docs-production
          path: |
            dist
            urls.txt
          if-no-files-found: error
          retention-days: 1

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: docs-production

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy prod to Cloudflare Pages
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@3.90.0 pages deploy dist --project-name=uichat-mira-docs --branch=prod 2>&1 | tee /tmp/wrangler-pages-deploy.log

          DEPLOYMENT_URL=$(grep -oE 'https://[A-Za-z0-9-]+\.uichat-mira-docs\.pages\.dev' /tmp/wrangler-pages-deploy.log | tail -n 1 || true)
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Wrangler completed without a parseable deployment URL."
            exit 1
          fi

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Cloudflare deployment: $DEPLOYMENT_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-production:
    name: T5 production smoke
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_URL: ${{ needs.deploy-cloudflare.outputs.deployment_url }}
      PRODUCTION_URL: https://mira.tomz.io
    steps:
      - name: Verify exact deployment and production domain
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Missing exact Cloudflare deployment URL."
            exit 1
          fi

          fetch() {
            local url="$1"
            local output="$2"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --output "$output" "$url"
          }

          wait_for_marker() {
            local base_url="$1"
            local output="$2"
            local attempt

            for attempt in $(seq 1 12); do
              if fetch "${base_url}/mira-deployment.json?sha=${GITHUB_SHA}" "$output" \
                && grep -Fq "\"commit\":\"${GITHUB_SHA}\"" "$output"; then
                return 0
              fi

              echo "Waiting for ${base_url} to expose production commit ${GITHUB_SHA} (${attempt}/12)..."
              sleep 5
            done

            echo "::error::${base_url} did not expose production commit ${GITHUB_SHA}."
            cat "$output" 2>/dev/null || true
            return 1
          }

          wait_for_marker "$DEPLOYMENT_URL" /tmp/deployment-marker.json
          wait_for_marker "$PRODUCTION_URL" /tmp/production-marker.json
          cmp /tmp/deployment-marker.json /tmp/production-marker.json

          fetch "${DEPLOYMENT_URL}/" /tmp/deployment-home.html
          fetch "${PRODUCTION_URL}/" /tmp/production-home.html
          grep -Fq "UIChat Mira" /tmp/deployment-home.html
          grep -Fq "UIChat Mira" /tmp/production-home.html

          GUIDE_PATH="/mira-docs-api/guide/deployment-cloudflare-pages/"
          fetch "${DEPLOYMENT_URL}${GUIDE_PATH}" /tmp/deployment-guide.html
          fetch "${PRODUCTION_URL}${GUIDE_PATH}" /tmp/production-guide.html
          grep -Fq "Wrangler Direct Upload" /tmp/deployment-guide.html
          grep -Fq "Wrangler Direct Upload" /tmp/production-guide.html

          echo "T5 production smoke passed."
          echo "Commit: ${GITHUB_SHA}"
          echo "Exact deployment: ${DEPLOYMENT_URL}"
          echo "Production domain: ${PRODUCTION_URL}"

  submit-baidu:
    needs:
      - build
      - deploy-cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: docs-production

      - name: Submit changed URLs to Baidu
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN_MIRA }}
        run: |
          if [ -z "$BAIDU_PUSH_TOKEN" ]; then
            echo "BAIDU_PUSH_TOKEN_MIRA is not configured; skipping Baidu submission."
            exit 0
          fi

          if [ ! -s urls.txt ]; then
            echo "No changed public URLs to submit; skipping."
            exit 0
          fi

          echo "Submitting $(wc -l < urls.txt) changed URL(s) to Baidu..."

          HTTP_STATUS=$(curl --silent --show-error \
            -o baidu-response.json \
            -w '%{http_code}' \
            -H 'Content-Type:text/plain' \
            --data-binary @urls.txt \
            "http://data.zz.baidu.com/urls?site=https://mira.tomz.io&token=${BAIDU_PUSH_TOKEN}")

          echo "Baidu HTTP status: $HTTP_STATUS"
          echo "Baidu response:"
          cat baidu-response.json
          echo

          if grep -qi 'over quota' baidu-response.json; then
            echo "::warning::Baidu daily URL submission quota is exhausted; skipping without failing the workflow."
            exit 0
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            exit 0
          fi

          echo "::error::Baidu URL submission failed with HTTP $HTTP_STATUS"
          exit 1
