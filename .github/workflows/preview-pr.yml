name: Preview PR on Cloudflare Pages

on:
  pull_request:
    branches:
      - prod
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 69
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview site
        run: pnpm run build

      - name: Deploy isolated preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@3.90.0 pages deploy dist \
            --project-name=uichat-mira-docs \
            --branch=preview-pr-69 2>&1 | tee /tmp/wrangler-pages-preview.log

          DEPLOYMENT_URL=$(grep -oE 'https://[A-Za-z0-9-]+\.uichat-mira-docs\.pages\.dev' /tmp/wrangler-pages-preview.log | tail -n 1 || true)
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Wrangler completed without a parseable deployment URL."
            exit 1
          fi

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "### Mira homepage preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
