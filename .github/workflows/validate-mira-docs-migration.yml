name: Validate MiraDocs migration

on:
  push:
    branches:
      - dev
      - test
      - prod
  pull_request:
    branches:
      - dev
      - test
      - prod
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: mira-docs-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test comic image pipeline
        run: pnpm run comic:test
      - name: Verify real MiraDocs content compatibility
        run: pnpm run verify:mira-docs
      - name: Build existing GitHub Pages site
        run: pnpm run build:github-pages
      - name: Verify generated static output
        env:
          EXPECTED_BASE: uichat-mira-docs
        run: pnpm run verify:static-output

  current-status-freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Mira dev truth source
        uses: actions/checkout@v4
        with:
          repository: uichat-mira/mira-desktop
          ref: dev
          path: .source/uichat-mira
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check current implementation freshness
        env:
          MIRA_SOURCE_PACKAGE: .source/uichat-mira/package.json
          MIRA_SOURCE_ROOT: .source/uichat-mira
        run: node scripts/verify-current-status.mjs
