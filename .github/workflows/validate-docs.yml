name: Validate Docs

on:
  push:
    branches:
      - dev
      - test
  pull_request:
    branches:
      - dev
      - test
      - prod
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test comic image pipeline
        run: pnpm run comic:test

      - name: Verify MiraDocs content compatibility
        run: pnpm run verify:mira-docs

      - name: Build GitHub Pages candidate
        run: pnpm run build:github-pages

      - name: Verify generated static output
        env:
          EXPECTED_BASE: uichat-mira-docs
        run: pnpm run verify:static-output

  preview-homepage:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 69 && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare preview candidate
        run: pnpm run build

      - name: Deploy isolated PR preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@3.90.0 pages deploy dist \
            --project-name=uichat-mira-docs \
            --branch=preview-pr-69 2>&1 | tee /tmp/wrangler-pages-preview.log

          DEPLOYMENT_URL=$(grep -oE 'https://[A-Za-z0-9-]+\.uichat-mira-docs\.pages\.dev' /tmp/wrangler-pages-preview.log | tail -n 1 || true)
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Wrangler completed without a parseable deployment URL."
            exit 1
          fi

          echo "### Mira homepage preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL: $DEPLOYMENT_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  current-status-freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout Mira dev truth source
        uses: actions/checkout@v7
        with:
          repository: uichat-mira/mira-desktop
          ref: dev
          path: .source/uichat-mira
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check current implementation freshness
        env:
          MIRA_SOURCE_PACKAGE: .source/uichat-mira/package.json
          MIRA_SOURCE_ROOT: .source/uichat-mira
        run: node scripts/verify-current-status.mjs
